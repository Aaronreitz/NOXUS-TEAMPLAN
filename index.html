<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Noxus-Teamplan</title>
    <link rel="stylesheet" href="dist.css" />
  </head>

  <body class="bg-noxus-bg text-noxus-text min-h-screen">

    <!-- Modern top bar: brand + pill month nav + actions -->
    <header class="topbar">
      <div class="brand">
        <img src="assets/noxus-icon-256.png" alt="Noxus" />
        <div class="brand-wrap">
          <div class="brand-wm">NOX<b>U</b>S</div>
          <div class="brand-sub">Teamplan</div>
        </div>
      </div>

      <div class="topbar-spacer"></div>

      <div class="pill" role="group" aria-label="Monatsnavigation">
        <button id="prevMonth" class="nav-btn" aria-label="Vorheriger Monat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </button>
        <span id="monthTitle" class="month-label">–</span>
        <button id="nextMonth" class="nav-btn" aria-label="Nächster Monat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>

      <button id="backupBtn" class="tbtn" title="Alle Daten als JSON-Datei sichern">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Sichern</span>
      </button>
      <button id="restoreBtn" class="tbtn" title="Sicherung laden – ersetzt alle aktuellen Daten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Laden</span>
      </button>
      <input id="restoreInput" type="file" accept=".json,application/json" hidden />
      <button id="exportExcelBtn" class="tbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Excel</span>
      </button>
      <button id="addColBtn" class="tbtn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Person</span>
      </button>
    </header>

    <!-- Main panel + plan table -->
    <main class="shell">
      <div class="panel">
        <table id="planTable" class="plan"></table>
      </div>
    </main>

    <!-- Legend lives outside .shell so it never scrolls away with the table -->
    <footer class="legend">
      <span class="item"><span class="sw s-n">N</span> Nachtbereitschaft</span>
      <span class="item"><span class="sw s-td">TD</span> Tagdienst</span>
      <span class="item"><span class="sw s-x">X</span> Folgetag nach N</span>
      <span class="item"><span class="sw s-u">U</span><span class="sw s-u">RT</span> Urlaub / Regenerationstag</span>
      <span class="item"><span class="sw s-kr">KR</span> Krank</span>
      <span class="item"><span class="sw s-tb">TB</span><span class="sw s-tb">SV</span> Teambesprechung / Supervision</span>
      <span class="item"><span class="sw s-fobi">FOBI</span> Fortbildung</span>
      <span style="margin-left:auto; font-family:'JetBrains Mono NF', monospace; font-size:11px; display:inline-flex; align-items:center; gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
        öffnet die Kalenderansicht je Person
      </span>
    </footer>

    <!-- Kalender-Modal -->
    <div id="calendarModal" class="modal-back" style="display:none">
      <div class="modal">
        <div class="modal-head">
          <span id="calModalTitle"></span>
          <div class="flex gap-2">
            <button id="calModalPrint" class="tbtn" style="height:30px;font-size:12px;padding:0 10px">Drucken</button>
            <button id="calModalClose" class="tbtn" style="height:30px;font-size:12px;padding:0 10px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div id="calModalGrid" class="modal-body"></div>
      </div>
    </div>

    <script src="src/lib/xlsx.bundle.js"></script>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
